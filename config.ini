[auth]
# 快期账户(TqAuth)用户名与密码，填你自己的
user = 15618075501
password = 15618075501

[settings]
# 监控的交易所（有交易所价差合约的是 DCE / CZCE，可做完整三腿）
exchanges = SHFE,DCE,CZCE,INE,GFEX,CFFEX
# 每个品种从最近月份起，取多少个月参与相邻配对（控制规模，避免远月冷门合约）
max_months = 6
# 只看相邻月份配对（true）；false 则把交易所列出的所有跨期组合也纳入
only_adjacent = true
# 限定品种，逗号分隔（如 m,i,RM,CF,SR），留空 = 全部
products =
# 两次重写文件(数据)的最小间隔秒数
refresh_seconds = 3
# HTML 页面自动刷新间隔秒数(可大些，便于交互筛选；可在页面里关掉自动刷新)
html_refresh_seconds = 10
# 品种配置表(转抛/仓储费/注销月 等)
product_config = all_product_config20260629.xlsx
# 年化资金利率默认值(百分比)，用于转抛比例；HTML 页面里可实时改
funding_rate = 6
# 输出目录
output_dir = output

[trade]
# 实盘期货公司账户(OTG)；组合下单仅实盘支持。dry-run 不需要填。
broker_id =
account =
password =
# 挂单超时秒数、单笔手数上限、价差走坏容忍(单位=price_tick的倍数,0=不启用)
order_timeout = 60
max_volume = 10
give_up_ticks = 0

[server]
# 交易台后端(spread_server.py)。机会页 opportunities.html 的选中同步也指向此地址(写死8010,改端口需重生成机会页)
host = 127.0.0.1
port = 8010
push_interval_sec = 1.0

[data]
# 历史数据根目录(务必放在网盘同步夹之外!)
root = I:\futures_data
